name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore matching debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring matching debug keystore from base64 artifact..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env file from secret
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle(.kts) found - project files were not uploaded to the repo."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found, using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/apk/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" ./CyberShield-latest.apk
          VERSION_CODE="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_NAME="1.0.${VERSION_CODE}"
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          # Create app-version.json for fast update checking
          cat <<EOF > app-version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseNotes": "Automated build for commit ${SHORT_SHA}: ${{ github.event.head_commit.message }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/CyberShield-latest.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-${{ steps.prepare_apk.outputs.version_name }}
          path: ./CyberShield-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "CyberShield ${{ steps.prepare_apk.outputs.version_name }}"
          body: |
            ### 🚀 CyberShield Update (${{ steps.prepare_apk.outputs.version_name }})
            - **Commit**: `${{ github.sha }}`
            - **Build**: Run #${{ github.run_number }}
            - **Message**: ${{ github.event.head_commit.message }}
            
            This release is automatically picked up by the installed CyberShield app for seamless in-app updating!
          files: |
            ./CyberShield-latest.apk
            ./app-version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
